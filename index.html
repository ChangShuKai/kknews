<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKNews 諺語投稿</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f1ea;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px #0002;width:min(420px,92vw)}
  h1{margin:0 0 16px;font-size:22px}
  label{display:block;margin:12px 0 4px;font-size:14px;color:#555}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:inherit}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;cursor:pointer}
  button.g{background:#fff;color:#111;border:1px solid #ccc}
  .msg{margin-top:12px;font-size:14px;min-height:20px}.err{color:#c00}.ok{color:#080}
  .hide{display:none}.me{font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
  <h1>寫下你想說的一句話</h1>

  <div id="loginView">
    <p>請使用學校帳號（<b>@hlc.edu.tw</b>）登入或註冊。</p>
    <button class="g" id="googleBtn">使用 Google 登入／註冊</button>
  </div>

  <div id="formView" class="hide">
    <div class="me">登入：<span id="who"></span> · <a href="#" id="logout">登出</a></div>
    <label>諺語／你想說的話</label>
    <textarea id="content" rows="3" maxlength="100"></textarea>
    <label>來源（人名）</label>
    <input id="author" maxlength="30">
    <button id="submit">送出</button>
  </div>
  <div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C = window.APP_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const say = (t, ok) => { $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); };

async function refresh() {
  // OAuth 失敗時（例如後端 trigger 擋下非學校帳號）會把錯誤放在網址
  const p = new URLSearchParams(location.hash.slice(1) + "&" + location.search.slice(1));
  if (p.get("error_description")) {
    say("請使用學校帳號（" + C.SCHOOL_DOMAIN + "）登入。");
    history.replaceState(null, "", location.pathname);
  }
  let { data: { session } } = await sb.auth.getSession();
  if (session) {
    const email = (session.user.email || "").toLowerCase();
    if (!email.endsWith(C.SCHOOL_DOMAIN)) {
      await sb.auth.signOut();
      say("請使用學校帳號（" + C.SCHOOL_DOMAIN + "）登入。");
      session = null;
    }
  }
  $("loginView").classList.toggle("hide", !!session);
  $("formView").classList.toggle("hide", !session);
  if (session) $("who").textContent = session.user.email;
}

$("googleBtn").onclick = () => sb.auth.signInWithOAuth({
  provider: "google",
  options: { redirectTo: location.origin + location.pathname, queryParams: { hd: "hlc.edu.tw", prompt: "select_account" } },
});
$("logout").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); say(""); refresh(); };

$("submit").onclick = async () => {
  const content = $("content").value.trim(), author = $("author").value.trim();
  if (!content || !author) return say("請填寫諺語與來源");
  const { data: { user } } = await sb.auth.getUser();
  const { error } = await sb.from("proverbs").insert({
    content, author, user_name: user.user_metadata?.full_name || null,
  });
  if (error) return say("送出失敗：" + error.message);
  $("content").value = ""; $("author").value = "";
  say("已送出，謝謝投稿！", true);
};

sb.auth.onAuthStateChange(() => refresh());
refresh();
</script>
</body>
</html>
