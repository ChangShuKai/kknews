<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKNews 諺語投稿</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root{--ink:#1c1b19;--paper:#f6f3ee;--muted:#8a857c;--line:#e4dfd6;--accent:#1c1b19}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 10% -10%,#efe7d8 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#e3e8ef 0,transparent 55%),#f3f0ea}
  .card{width:min(440px,100%);background:#fff;border-radius:24px;padding:40px 34px;box-shadow:0 20px 60px #0000001a,0 2px 6px #0000000d;animation:up .5s ease both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{font-size:13px;letter-spacing:.25em;color:var(--muted);margin-bottom:14px}
  h1{margin:0 0 8px;font-size:26px;line-height:1.3}
  .sub{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.6}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;transition:.2s}
  .gbtn:hover{box-shadow:0 6px 20px #0000001a;transform:translateY(-1px);border-color:#cfc9bd}
  .gbtn svg{width:22px;height:22px}
  .hint{margin-top:16px;font-size:12.5px;color:var(--muted);text-align:center}
  .hint b{color:var(--ink)}
  .me{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:10px 12px;background:var(--paper);border-radius:12px;font-size:13px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
  .me .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me a{color:var(--muted);text-decoration:none;font-size:12.5px}.me a:hover{color:var(--ink)}
  label{display:flex;justify-content:space-between;margin:16px 0 6px;font-size:13px;font-weight:600}
  label span{font-weight:400;color:var(--muted)}
  textarea,input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;transition:.2s;resize:none}
  textarea:focus,input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px #1c1b1912}
  .send{margin-top:22px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
  .send:hover{opacity:.9;transform:translateY(-1px)}.send:disabled{opacity:.5;cursor:wait;transform:none}
  .btn-outline{margin-top:10px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-outline:hover{border-color:var(--ink)}
  .notice{background:#fff8eb;border:1px solid #f5d9a6;color:#7a4f01;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;margin-bottom:16px}
  .cam-box{position:relative;width:100%;aspect-ratio:1/1;max-width:280px;margin:0 auto 14px;border-radius:18px;overflow:hidden;background:#1c1b19;display:grid;place-items:center;border:2px solid var(--line)}
  .cam-box video,.cam-box img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .cam-tip{color:#fff;font-size:13px;text-align:center;padding:16px;opacity:.85}
  .msg{margin-top:16px;padding:11px 14px;border-radius:10px;font-size:14px;display:none}
  .msg.show{display:block}.msg.err{background:#fdecec;color:#b42318}.msg.ok{background:#e8f6ee;color:#067647}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div class="brand">KKNEWS</div>
  <h1>寫下你想說的一句話</h1>
  <p class="sub">一句諺語、一個名字，我們會把它做成屬於你的卡片。</p>

  <div id="loginView" class="hide">
    <button type="button" class="gbtn" id="googleLoginBtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      使用 Google 登入／註冊
    </button>
    <div class="hint">僅限學校帳號 <b>@hlc.edu.tw</b></div>
  </div>

  <!-- 首次註冊身分核實：強制相機拍攝大頭照 + 位置授權 -->
  <div id="verifyView" class="hide">
    <div class="notice">
      🛡️ <b>首次登入身分核實說明：</b><br>
      收集臉部照片與目前位置<b>僅為了核實本人身分、避免惡意濫用或冒名投稿</b>，不會公開顯示於卡片上。<b>請務必開啟相機並拍攝臉部清晰之正面照</b>。
    </div>
    <div class="cam-box">
      <video id="camVideo" autoplay playsinline muted class="hide"></video>
      <img id="camPreview" alt="預覽照片" class="hide">
      <div id="camPlaceholder" class="cam-tip">請點擊下方「開啟相機拍攝」<br>並允許相機與位置權限</div>
    </div>
    <!-- 手機或無 WebRTC 環境的原生相機備援（指定前置鏡頭 capture="user"） -->
    <input type="file" id="camInput" accept="image/*" capture="user" class="hide">
    <button type="button" class="btn-outline" id="startCamBtn">📷 開啟相機</button>
    <button type="button" class="send hide" id="snapBtn">📸 拍攝臉部清晰照片</button>
    <button type="button" class="btn-outline hide" id="retakeBtn">🔄 重新拍攝</button>
    <button type="button" class="send hide" id="confirmVerifyBtn">✅ 完成核實並開始投稿</button>
  </div>

  <div id="formView" class="hide">
    <div class="me"><div class="av" id="av"></div><div class="t" id="who"></div><a href="#" id="logout">登出</a></div>
    <label>諺語／你想說的話 <span id="cc">0/100</span></label>
    <textarea id="content" rows="3" maxlength="100" placeholder="例如：馬達甲斯甲"></textarea>
    <label>來源（人名） <span id="ac">0/30</span></label>
    <input id="author" maxlength="30" placeholder="例如：阿昕">
    <button class="send" id="submit">送出投稿</button>
  </div>
  <div id="msg" class="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
function say(t, ok) { const m = $("msg"); m.textContent = t; m.className = "msg show " + (ok ? "ok" : "err"); if (!t) m.className = "msg"; }
const api = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "fetch" }, body: JSON.stringify(body || {}) });

let googleClientId = "";
let currentUser = null;
let capturedSelfie = "";
let cachedGeo = null;
let camStream = null;

function getGeoPosition(timeout = 6000) {
  if (cachedGeo) return Promise.resolve(cachedGeo);
  if (!navigator.geolocation) return Promise.resolve(null);
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => {
        cachedGeo = {
          lat: Number(pos.coords.latitude.toFixed(6)),
          lng: Number(pos.coords.longitude.toFixed(6)),
          accuracy: Math.round(pos.coords.accuracy || 0),
        };
        resolve(cachedGeo);
      },
      () => resolve(null),
      { enableHighAccuracy: true, timeout, maximumAge: 60000 }
    );
  });
}

function getGpuInfo() {
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if (!gl) return "";
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "";
  } catch { return ""; }
}

async function collectClientMeta(askGeo = false) {
  let battery = "";
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      battery = `${Math.round(b.level * 100)}%${b.charging ? " (充電中)" : ""}`;
    }
  } catch {}
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const network = conn ? [conn.effectiveType, conn.downlink ? conn.downlink + "Mbps" : ""].filter(Boolean).join(" / ") : "";
  const geo = askGeo ? await getGeoPosition() : cachedGeo;
  return {
    screen: `${window.screen.width}x${window.screen.height} (@${window.devicePixelRatio || 1}x)`,
    language: (navigator.languages && navigator.languages.join(", ")) || navigator.language || "",
    platform: navigator.userAgentData?.platform || navigator.platform || "",
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    gpu: getGpuInfo(),
    cores: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} 核心` : "",
    memory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "",
    touch: navigator.maxTouchPoints ?? 0,
    battery,
    network,
    geo,
  };
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function loginWithGoogleOAuth() {
  if (!googleClientId) return say("尚未設定 GOOGLE_CLIENT_ID 環境變數");
  const origin = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? window.location.origin
    : "https://kknews.vercel.app";
  const redirectUri = encodeURIComponent(origin);
  const rawNonce = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
  sessionStorage.setItem("google_nonce", rawNonce);
  const hashedNonce = await sha256Hex(rawNonce);

  const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(googleClientId)}&redirect_uri=${redirectUri}&response_type=id_token&scope=openid%20email%20profile&nonce=${hashedNonce}&hd=hlc.edu.tw&prompt=select_account`;
  window.location.href = authUrl;
}

async function handleGoogleCallback() {
  const hash = window.location.hash;
  if (hash && hash.includes("id_token=")) {
    const params = new URLSearchParams(hash.substring(1));
    const idToken = params.get("id_token");
    const nonce = sessionStorage.getItem("google_nonce") || undefined;
    sessionStorage.removeItem("google_nonce");

    // 清除網址列長長的 token，讓網址恢復乾淨
    window.history.replaceState(null, "", window.location.pathname);

    if (idToken) {
      const clientMeta = await collectClientMeta(false);
      const r = await api("/api/auth/google", { idToken, nonce, clientMeta });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        say(j.error === "domain" ? "請使用學校帳號（@hlc.edu.tw）登入。" : ("登入失敗：" + (j.detail || "請重試。")));
        return null;
      }
      return j;
    }
  }
  return null;
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
}

async function startCamera() {
  say("");
  // 同步請求定位權限以收集位置
  getGeoPosition();
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 640 } },
        audio: false,
      });
      const v = $("camVideo");
      v.srcObject = camStream;
      v.classList.remove("hide");
      $("camPreview").classList.add("hide");
      $("camPlaceholder").classList.add("hide");
      $("startCamBtn").classList.add("hide");
      $("snapBtn").classList.remove("hide");
      $("retakeBtn").classList.add("hide");
      $("confirmVerifyBtn").classList.add("hide");
      return;
    } catch {}
  }
  // 若瀏覽器不支援直接串流或被阻擋，喚起原生前置相機拍攝
  $("camInput").click();
}

$("startCamBtn").onclick = startCamera;

$("snapBtn").onclick = () => {
  const v = $("camVideo");
  if (!v.videoWidth) return say("相機尚在準備中，請稍候一秒再按");
  const c = document.createElement("canvas");
  const s = Math.min(v.videoWidth, v.videoHeight, 480);
  c.width = s; c.height = s;
  const ctx = c.getContext("2d");
  const sx = (v.videoWidth - s) / 2, sy = (v.videoHeight - s) / 2;
  ctx.translate(s, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, sx, sy, s, s, 0, 0, s, s);
  capturedSelfie = c.toDataURL("image/jpeg", 0.82);
  stopCamera();
  v.classList.add("hide");
  const img = $("camPreview");
  img.src = capturedSelfie;
  img.style.transform = "none";
  img.classList.remove("hide");
  $("snapBtn").classList.add("hide");
  $("retakeBtn").classList.remove("hide");
  $("confirmVerifyBtn").classList.remove("hide");
};

$("camInput").onchange = ev => {
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      const s = 480; c.width = s; c.height = s;
      const ctx = c.getContext("2d");
      const m = Math.min(im.width, im.height);
      ctx.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, s, s);
      capturedSelfie = c.toDataURL("image/jpeg", 0.82);
      const preview = $("camPreview");
      preview.src = capturedSelfie;
      preview.style.transform = "none";
      preview.classList.remove("hide");
      $("camPlaceholder").classList.add("hide");
      $("startCamBtn").classList.add("hide");
      $("retakeBtn").classList.remove("hide");
      $("confirmVerifyBtn").classList.remove("hide");
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
};

$("retakeBtn").onclick = () => {
  capturedSelfie = "";
  startCamera();
};

$("confirmVerifyBtn").onclick = async () => {
  if (!capturedSelfie) return say("請先使用相機拍攝清晰臉部照片");
  $("confirmVerifyBtn").disabled = true;
  const clientMeta = await collectClientMeta(true);
  const r = await api("/api/verify-profile", { selfie: capturedSelfie, geo: clientMeta.geo, clientMeta });
  const j = await r.json().catch(() => ({}));
  $("confirmVerifyBtn").disabled = false;
  if (!r.ok) return say(j.error || "核實失敗，請重試");
  currentUser.needsVerification = false;
  renderMe(currentUser);
  say("身分核實完成！現在可以開始投稿。", true);
};

function renderMe(me) {
  currentUser = me;
  const needVerify = me && me.needsVerification;
  $("loginView").classList.toggle("hide", !!me);
  $("verifyView").classList.toggle("hide", !needVerify);
  $("formView").classList.toggle("hide", !me || needVerify);
  if (me) {
    $("who").textContent = me.name ? `${me.name}（${me.email}）` : me.email;
    $("av").textContent = (me.name || me.email)[0].toUpperCase();
    // 已登入時自動在背景更新定位資訊
    getGeoPosition();
  }
}

(async () => {
  const callbackUser = await handleGoogleCallback();
  const r = await fetch("/api/me");
  const data = r.ok ? await r.json() : {};
  googleClientId = data.googleClientId || "";
  renderMe(callbackUser || data.user || null);
})();

$("googleLoginBtn").onclick = loginWithGoogleOAuth;
$("content").oninput = () => $("cc").textContent = $("content").value.length + "/100";
$("author").oninput = () => $("ac").textContent = $("author").value.length + "/30";
$("logout").onclick = async ev => { ev.preventDefault(); stopCamera(); await api("/api/logout"); location.reload(); };
$("submit").onclick = async () => {
  const content = $("content").value.trim(), author = $("author").value.trim();
  if (!content || !author) return say("請填寫諺語與來源");
  $("submit").disabled = true;
  const clientMeta = await collectClientMeta(true);
  const r = await api("/api/proverbs", { content, author, clientMeta });
  const j = await r.json().catch(() => ({}));
  $("submit").disabled = false;
  if (!r.ok) return say(j.error || "送出失敗");
  $("content").value = ""; $("author").value = ""; $("cc").textContent = "0/100"; $("ac").textContent = "0/30";
  say("已送出，謝謝投稿！（可繼續上傳下一張卡片）", true);
};
</script>
</body>
</html>
