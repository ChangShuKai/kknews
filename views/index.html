<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKNews 諺語投稿</title>
<style>
  body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f1ea;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px #0002;width:min(420px,92vw)}
  h1{margin:0 0 16px;font-size:22px}
  label{display:block;margin:12px 0 4px;font-size:14px;color:#555}
  input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:inherit}
  button,a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;cursor:pointer}
  a.g{background:#fff;color:#111;border:1px solid #ccc}
  .msg{margin-top:12px;font-size:14px;min-height:20px}.err{color:#c00}.ok{color:#080}
  .hide{display:none}.me{font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
  <h1>寫下你想說的一句話</h1>
  <div id="loginView" class="hide">
    <p>請使用學校帳號（<b>@hlc.edu.tw</b>）登入或註冊。</p>
    <a class="btn g" href="/auth/google">使用 Google 登入／註冊</a>
  </div>
  <div id="formView" class="hide">
    <div class="me">登入：<span id="who"></span> · <a href="#" id="logout">登出</a></div>
    <label>諺語／你想說的話</label>
    <textarea id="content" rows="3" maxlength="100"></textarea>
    <label>來源（人名）</label>
    <input id="author" maxlength="30">
    <button id="submit">送出</button>
  </div>
  <div id="msg" class="msg"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const say = (t, ok) => { $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); };
const api = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "fetch" }, body: JSON.stringify(body || {}) });

(async () => {
  const e = new URLSearchParams(location.search).get("e");
  if (e) { say(e === "domain" ? "請使用學校帳號（@hlc.edu.tw）登入。" : "登入失敗，請重試。"); history.replaceState(null, "", "/"); }
  const r = await fetch("/api/me");
  const me = r.ok ? await r.json() : null;
  $("loginView").classList.toggle("hide", !!me);
  $("formView").classList.toggle("hide", !me);
  if (me) $("who").textContent = me.email;
})();

$("logout").onclick = async ev => { ev.preventDefault(); await api("/api/logout"); location.reload(); };
$("submit").onclick = async () => {
  const content = $("content").value.trim(), author = $("author").value.trim();
  if (!content || !author) return say("請填寫諺語與來源");
  const r = await api("/api/proverbs", { content, author });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return say(j.error || "送出失敗");
  $("content").value = ""; $("author").value = "";
  say("已送出，謝謝投稿！", true);
};
</script>
</body>
</html>
