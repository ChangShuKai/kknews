<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KKNews 後台登入</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body class="center-page">
<main class="card" style="width:min(390px,100%)">
  <div class="brand-row">
    <div class="brand"><img src="/icon.svg" alt="">KKNEWS <small>ADMIN</small></div>
  </div>
  <h2>管理員登入</h2>
  <p class="sub">請輸入管理員帳號與密碼以進入後台。</p>

  <form id="loginForm" autocomplete="off">
    <label class="field">
      <span class="lbl">管理員信箱</span>
      <input class="input" id="email" type="email" placeholder="admin@example.com" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span class="lbl">密碼</span>
      <input class="input" id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn block" id="btn">登入後台</button>
  </form>
  <div id="err" class="alert" role="alert" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const k = new URLSearchParams(location.search).get("k") || "";
// 將網址列上的存取金鑰移除，避免留在瀏覽器歷史紀錄
if (k) history.replaceState(null, "", location.pathname);

function sayErr(t) {
  const m = $("err");
  m.textContent = t;
  m.className = t ? "alert show err" : "alert";
}

$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  sayErr("");
  $("btn").disabled = true;
  const r = await fetch("/api/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Requested-With": "fetch", "X-Access-Key": k },
    body: JSON.stringify({ email: $("email").value.trim(), password: $("pw").value }),
  });
  if (r.ok) {
    location.replace("/adminusercontrol");
    return;
  }
  $("btn").disabled = false;
  sayErr(r.status === 429 ? "嘗試次數過多，請稍後再試" : "帳號或密碼錯誤");
};
</script>
</body>
</html>
