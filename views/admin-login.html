<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KKNews 後台登入</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body class="center-page">
<main class="card" style="width:min(390px,100%)">
  <div class="brand-row">
    <div class="brand"><img src="/icon.svg" alt="">KKNEWS <small>ADMIN</small></div>
  </div>
  <h2>管理員登入</h2>
  <p class="sub">支援 Super Admin（最高權限）與一般管理員（唯讀檢視權限）帳號登入。</p>

  <form id="loginForm" autocomplete="off">
    <label class="field">
      <span class="lbl">管理員信箱</span>
      <input class="input" id="email" type="email" placeholder="admin@sixstarculture.com" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span class="lbl">
        <span>密碼</span>
        <button type="button" id="togglePwBtn" style="background:none;border:0;color:var(--link);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0">👁️ 一鍵查看密碼</button>
      </span>
      <input class="input" id="pw" type="password" placeholder="請輸入密碼" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn block" id="btn">登入後台</button>
  </form>
  <div id="err" class="alert" role="alert" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const urlK = new URLSearchParams(location.search).get("k") || "";
if (urlK) {
  try { sessionStorage.setItem("kk_admin_k", urlK); } catch {}
  history.replaceState(null, "", location.pathname);
}
const k = urlK || (() => { try { return sessionStorage.getItem("kk_admin_k") || ""; } catch { return ""; } })();

$("togglePwBtn").onclick = () => {
  const isPw = $("pw").type === "password";
  $("pw").type = isPw ? "text" : "password";
  $("togglePwBtn").textContent = isPw ? "🙈 隱藏密碼" : "👁️ 一鍵查看密碼";
};

function sayErr(t) {
  const m = $("err");
  m.textContent = t;
  m.className = t ? "alert show err" : "alert";
}

$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  sayErr("");
  $("btn").disabled = true;
  const r = await fetch("/api/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Requested-With": "fetch", "X-Access-Key": k },
    body: JSON.stringify({ email: $("email").value.trim(), password: $("pw").value }),
  });
  if (r.ok) {
    location.replace("/adminusercontrol");
    return;
  }
  const j = await r.json().catch(() => ({}));
  $("btn").disabled = false;
  sayErr(r.status === 429 ? "嘗試次數過多，請稍後再試" : (j.error || "帳號或密碼錯誤"));
};
</script>
</body>
</html>
