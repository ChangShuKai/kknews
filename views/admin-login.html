<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KKNews · 後台管理登入</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .login-card {
    width: min(440px, 100%);
    background: var(--surface-solid);
    border: 1px solid var(--line);
    border-radius: var(--r-xl);
    padding: 44px 38px 38px;
    box-shadow: var(--shadow-floating), var(--shadow-inner-glow);
    animation: applePop 0.38s var(--spring-smooth) both;
  }
  .login-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
    flex-wrap: wrap;
  }
  .login-brand-left {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .login-brand img {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .brand-icon-fallback {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--gradient-brand);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    display: inline-grid;
    place-items: center;
    letter-spacing: -0.05em;
  }
  .login-brand small {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    background: var(--ink);
    color: #fff;
    padding: 2.5px 8.5px;
    border-radius: var(--r-pill);
  }
  [data-theme="dark"] .login-card {
    background: rgba(19, 29, 51, 0.92);
    border-color: rgba(255, 255, 255, 0.14);
  }
  [data-theme="dark"] .login-brand small {
    background: var(--blue);
    color: #fff;
  }
</style>
</head>
<body style="min-height:100vh;display:grid;place-items:center;padding:24px;background-color:var(--bg)">

<main class="login-card">
  <div class="login-brand">
    <div class="login-brand-left">
      <img src="/icon.svg" alt="KKNews Logo" onerror="this.onerror=null;this.classList.add('hide');this.parentElement.insertAdjacentHTML('afterbegin','<div class=\'brand-icon-fallback\'>KK</div>');">
      <span>KKNEWS</span>
      <small>CONSOLE</small>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="切換深淺色外觀" aria-label="切換深淺色外觀">🌙</button>
      <span class="device-profile-badge" id="adminLoginDeviceBadge">💻 電腦版面</span>
    </div>
  </div>

  <h1 style="margin:0 0 8px;font-size:24px;font-weight:800">管理員安全登入</h1>
  <p class="sub" style="margin-bottom:22px;font-size:13.5px;line-height:1.55">請輸入授權管理員信箱與密碼，進入 KKNews 雲端管理與 DFC 防暴雷主控台。</p>

  <form id="loginForm" autocomplete="off">
    <label class="field" style="margin-top:0">
      <span class="lbl">管理員電子郵件</span>
      <input class="input" id="email" type="email" placeholder="admin@example.com" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>

    <label class="field">
      <span class="lbl">
        <span>安全密碼</span>
        <button type="button" id="togglePwBtn" style="background:none;border:0;color:var(--blue);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px">
          <span id="togglePwIcon">👁️</span>
          <span id="togglePwText">顯示密碼</span>
        </button>
      </span>
      <input class="input" id="pw" type="password" placeholder="請輸入登入密碼" autocomplete="current-password" required>
    </label>

    <button type="submit" class="btn primary block" id="btn" style="margin-top:24px">登入後台主控台</button>
  </form>

  <div id="err" class="alert err" role="alert" aria-live="polite"></div>
</main>

<script>
const $ = id => document.getElementById(id);

try {
  const saved = localStorage.getItem("kk_theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
} catch {}

window.addEventListener("error", e => {
  if (e.target && e.target.tagName === "IMG") {
    e.target.classList.add("img-load-error", "hide");
    const p = e.target.parentElement;
    if (p && !p.querySelector(".brand-icon-fallback")) {
      p.insertAdjacentHTML("afterbegin", '<div class="brand-icon-fallback">KK</div>');
    }
  }
}, true);

function applyLoginDeviceProfile() {
  const sw = Math.round(window.screen?.width || window.innerWidth);
  const sh = Math.round(window.screen?.height || window.innerHeight);
  const dpr = Number((window.devicePixelRatio || 1).toFixed(2));
  const isMobileUA = /Mobile|iPhone|Android.*Mobile/i.test(navigator.userAgent || "");
  const vw = Math.round(window.innerWidth || document.documentElement.clientWidth || 1280);
  const vh = Math.round(window.innerHeight || document.documentElement.clientHeight || 800);

  let zoom = 1.0;
  if (vw >= 3000 || sw >= 3400) zoom = 1.35;
  else if (vw >= 2300 || (sw >= 2560 && dpr <= 1.25)) zoom = 1.20;
  else if (vw >= 1950) zoom = 1.12;
  else if (vw >= 1750 && vh >= 940) zoom = 1.05;
  else if (vh < 740 && vw >= 1024) zoom = 0.92;
  else if (vw < 680 || isMobileUA) zoom = 1.0;

  document.documentElement.style.zoom = String(zoom);
  document.documentElement.style.setProperty("--app-zoom", String(zoom));

  const layout = vw < 680 ? "mobile" : vw < 1024 ? "tablet" : "desktop";
  document.documentElement.setAttribute("data-layout", layout);
  const label = layout === "mobile" ? "📱 手機版面" : layout === "tablet" ? "📟 平板版面" : "💻 電腦版面";
  if ($("adminLoginDeviceBadge")) $("adminLoginDeviceBadge").textContent = `${label} · ${vw}×${vh} (${Math.round(zoom * 100)}% 自適應)`;
}
applyLoginDeviceProfile();
window.addEventListener("resize", applyLoginDeviceProfile);

const urlK = new URLSearchParams(location.search).get("k") || "";
if (urlK) {
  try { sessionStorage.setItem("kk_admin_k", urlK); } catch {}
  history.replaceState(null, "", location.pathname);
}
const k = urlK || (() => { try { return sessionStorage.getItem("kk_admin_k") || ""; } catch { return ""; } })();

const themeBtn = $("themeToggleBtn");
if (themeBtn) {
  const updateThemeBtn = () => {
    themeBtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  };
  updateThemeBtn();
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("kk_theme", next); } catch {}
    updateThemeBtn();
  };
}

$("togglePwBtn").onclick = () => {
  const isPw = $("pw").type === "password";
  $("pw").type = isPw ? "text" : "password";
  if ($("togglePwText")) $("togglePwText").textContent = isPw ? "隱藏密碼" : "顯示密碼";
  if ($("togglePwIcon")) $("togglePwIcon").textContent = isPw ? "🔒" : "👁️";
};

function sayErr(t) {
  const m = $("err");
  m.textContent = t;
  m.className = t ? "alert show err" : "alert err";
}

$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  sayErr("");
  $("btn").disabled = true;
  $("btn").textContent = "正在安全驗證...";
  try {
    const r = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "fetch", "X-Access-Key": k },
      body: JSON.stringify({ email: $("email").value.trim(), password: $("pw").value }),
    });
    if (r.ok) {
      location.replace("/adminusercontrol");
      return;
    }
    const j = await r.json().catch(() => ({}));
    $("btn").disabled = false;
    $("btn").textContent = "登入後台主控台";
    sayErr(r.status === 429 ? "登入嘗試次數過多，請稍後再試" : (j.error || "帳號或密碼錯誤"));
  } catch {
    $("btn").disabled = false;
    $("btn").textContent = "登入後台主控台";
    sayErr("伺服器連線逾時，請重試");
  }
};
</script>
</body>
</html>
