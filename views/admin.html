<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>後台管理</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1c1b19;--muted:#8a857c;--line:#e4dfd6}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f3f0ea;color:var(--ink);margin:0}
  header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;margin-right:auto}
  .badge{background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;margin-left:8px;font-weight:600}
  main{padding:24px;max-width:1500px;margin:0 auto}
  input,textarea{width:100%;padding:10px 12px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;resize:vertical;background:#fff;transition:.2s}
  input:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px #1c1b1912}
  button{padding:9px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  button:hover{opacity:.88;transform:translateY(-1px)}
  button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.s.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.d{background:#fff;color:#b42318;border:1px solid #f3c9c5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .item{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 28px #0000000f;transition:.2s}
  .item:hover{box-shadow:0 14px 36px #0000001c}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px;word-break:break-all;line-height:1.5}
  .meta b{color:var(--ink);font-size:14px}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:repeating-conic-gradient(#eee 0 25%,#f8f8f8 0 50%) 0 0/16px 16px}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}
  .sz{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .sz input{width:80px;margin:0;padding:8px 10px}
  .hide{display:none!important}
  .u-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
  .u-card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px #0000000f;display:flex;flex-direction:column;gap:12px}
  .u-head{display:flex;align-items:center;gap:14px}
  .u-av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;object-fit:cover;border:2px solid var(--line)}
  .u-title{flex:1;min-width:0}
  .u-title b{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .u-title span{font-size:13px;color:var(--muted)}
  .u-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f8f6f2;padding:12px;border-radius:14px;border:1px solid var(--line)}
  .u-pbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .u-pbox small{font-size:11.5px;font-weight:700;color:var(--muted)}
  .u-pbox img{width:110px;height:110px;border-radius:14px;object-fit:cover;border:1.5px solid var(--line);background:#eee;cursor:zoom-in}
  .u-pbox .no-pic{width:110px;height:110px;border-radius:14px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);background:#fff}
  .u-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f6f3ee;padding:10px 14px;border-radius:12px;text-align:center}
  .u-stat b{font-size:20px;display:block;color:var(--ink)}
  .u-stat small{font-size:12px;color:var(--muted)}
  .u-sec{font-size:12.5px;color:var(--muted);line-height:1.7;word-break:break-all;border-top:1px solid var(--line);padding-top:10px}
  .u-sec-title{font-size:12px;font-weight:700;color:var(--ink);background:#f3f0ea;display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:6px}
  .u-sec strong{color:var(--ink)}
  .u-sec a{color:#0b57d0;text-decoration:none;font-weight:600}.u-sec a:hover{text-decoration:underline}
  .mini-photos{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px 10px;background:#f8f6f2;border-radius:10px}
  .mini-photos .mp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .mini-photos img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">投稿管理<span class="badge" id="count">0</span></h1>
  <button id="toggleUsers" class="s">已登入帳號 (<span id="uCount">0</span>)</button>
  <label class="sz" id="szWrap">文字大小 <input id="size" type="number" min="24" max="200" step="2"></label>
  <button id="reload" class="s">重新整理</button>
  <button id="dlAll">全部下載 ZIP</button>
  <button id="logout" class="s">登出</button>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="usersGrid" class="u-grid hide"></div>
</main>

<script src="/adminusercontrol/jszip.js"></script>
<script>
const $ = id => document.getElementById(id);
let rows = [], users = [], userMap = {}, showUsers = false;
const H = { "Content-Type": "application/json", "X-Requested-With": "fetch" };

/* ---------- 卡片繪製：768x1024 米白圓角卡 + 黑色粗體字 ---------- */
const FONT = '"Reggae One","Noto Serif TC",serif';
function wrap(ctx, text, maxW) {
  const lines = []; let cur = "";
  for (const ch of text) {
    if (ch === "\n" || ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch === "\n" ? "" : ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
let FONT_SIZE = parseInt(localStorage.getItem("cardFontSize")) || 70;
function drawCard(canvas, text, author) {
  const W = 768, H = 1024; canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.28)"; ctx.shadowBlur = 18; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 4;
  ctx.fillStyle = "#f4f2ee";
  ctx.beginPath(); ctx.roundRect(28, 4, 692, 996, 44); ctx.fill();
  ctx.restore();
  const CARD_X = 28, CARD_W = 692;
  const size = FONT_SIZE;                   // 後台可調的文字大小
  // 卡片左右各留一個字寬 → 每行可用寬度 = 卡片寬 - 2 個字；最多 8 字
  const PER_LINE = Math.max(1, Math.min(8, Math.floor((CARD_W - 2 * size) / size)));
  ctx.font = `${size}px ${FONT}`;
  const lines = [];
  for (const para of String(text).split("\n")) {
    const chars = Array.from(para);
    if (!chars.length) { lines.push(""); continue; }
    for (let i = 0; i < chars.length; i += PER_LINE) lines.push(chars.slice(i, i + PER_LINE).join(""));
  }
  const lh = size * 1.35, total = lines.length * lh, top = 500 - total / 2;
  let widest = 0;
  lines.forEach(l => { widest = Math.max(widest, ctx.measureText(l).width); });
  const x = CARD_X + (CARD_W - widest) / 2;  // 以卡片中心置中
  ctx.fillStyle = "#000"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  lines.forEach((l, i) => ctx.fillText(l, x, top + lh * i + lh / 2));
  const as = 32;
  ctx.font = `${as}px ${FONT}`; ctx.textAlign = "right";
  ctx.fillText("-" + author, x + widest, top + total + as * 0.9);
}
async function ensureFont(text) { try { await document.fonts.load(`40px ${FONT}`, text); } catch {} }

/* ---------- 資料 ---------- */
async function load() {
  const [rp, ru] = await Promise.all([
    fetch("/api/admin/proverbs"),
    fetch("/api/admin/users"),
  ]);
  if (rp.status === 404 || ru.status === 404) return location.reload();   // session 過期
  rows = rp.ok ? await rp.json() : [];
  users = ru.ok ? await ru.json() : [];
  userMap = {};
  for (const u of users) { userMap[u.id] = u; userMap[u.email] = u; }
  $("uCount").textContent = users.length;
  render();
  renderUsers();
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fname = r => `${r.id}_${(r.user_email || "").split("@")[0]}.png`;
function save(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function fmtGeo(g) {
  if (!g || g.lat == null || g.lng == null) return "未授權或未提供位置";
  const url = `https://www.google.com/maps?q=${encodeURIComponent(g.lat + "," + g.lng)}`;
  return `<a href="${url}" target="_blank" rel="noopener">${esc(g.lat)}, ${esc(g.lng)}</a>（精準度 ±${esc(g.accuracy || 0)}m）`;
}
function unpackRow(r) {
  let name = r.user_name || "";
  let meta = r.user_meta || {};
  if (name.startsWith("{")) {
    try {
      const parsed = JSON.parse(name);
      name = parsed.name || "";
      meta = { ...parsed, ...meta };
    } catch {}
  }
  const u = userMap[r.user_id] || userMap[r.user_email] || {};
  return {
    ...r,
    display_name: name || u.name || (r.user_email || "").split("@")[0],
    device_info: r.device_info || meta.device_info || u.last_device || "未記錄裝置",
    user_agent: r.user_agent || meta.user_agent || u.last_ua || "",
    ip_address: r.ip_address || meta.ip_address || u.last_ip || "",
    google_sub: r.google_sub || meta.google_sub || u.google_sub || "",
    given_name: meta.given_name || u.given_name || "",
    family_name: meta.family_name || u.family_name || "",
    picture: r.user_avatar || meta.picture || u.picture || "",
    selfie: u.selfie || "",
    hd: meta.hd || u.hd || "",
    locale: meta.locale || u.locale || "",
    timezone: meta.timezone || u.timezone || "",
    geo: meta.geo || u.geo || null,
    gpu: meta.gpu || u.gpu || "",
    cores: meta.cores || u.cores || "",
    memory: meta.memory || u.memory || "",
    battery: meta.battery || u.battery || "",
    network: meta.network || u.network || "",
  };
}

async function render() {
  $("count").textContent = showUsers ? users.length : rows.length;
  const grid = $("grid"); grid.innerHTML = "";
  if (!rows.length) { grid.innerHTML = '<div class="empty">目前還沒有投稿</div>'; return; }
  await ensureFont(rows.map(r => r.content + r.author).join(""));
  for (const raw of rows) {
    const r = unpackRow(raw);
    const el = document.createElement("div"); el.className = "item";
    const hw = [
      r.gpu ? `GPU: ${esc(r.gpu)}` : "",
      r.cores ? `CPU: ${esc(r.cores)}` : "",
      r.memory ? `RAM: ${esc(r.memory)}` : "",
      r.battery ? `電量: ${esc(r.battery)}` : "",
      r.network ? `網路: ${esc(r.network)}` : "",
    ].filter(Boolean).join(" · ");

    el.innerHTML = `<div class="meta">
        <b>#${r.id} · ${esc(r.display_name)}</b> · 🕒 ${new Date(r.created_at).toLocaleString()}
        <div class="mini-photos">
          <div class="mp">
            ${r.picture ? `<img src="${esc(r.picture)}" title="點擊放大 Google 帳號頭貼" onclick="window.open(this.src)" referrerpolicy="no-referrer">` : ""}
            <span><b>Google 帳號</b><br>${esc(r.user_email)}</span>
          </div>
          <div class="mp" style="margin-left:auto">
            ${r.selfie ? `<img src="${esc(r.selfie)}" title="點擊放大相機核實自拍照" onclick="window.open(this.src)">` : ""}
            <span><b>${r.selfie ? "📸 實拍大頭照" : "未拍攝實拍照"}</b></span>
          </div>
        </div>
        <div class="u-sec">
          <span class="u-sec-title">🔹 Google 帳號原始資料</span><br>
          姓名：<strong>${esc(r.display_name)}</strong>（姓：${esc(r.family_name || "—")} / 名：${esc(r.given_name || "—")}）<br>
          Google ID：${esc(r.google_sub || "—")} · 網域：${esc(r.hd || "—")}
        </div>
        <div class="u-sec" style="margin-top:6px">
          <span class="u-sec-title">🔸 我們收集的環境與定位資訊</span><br>
          💻 裝置／瀏覽器：<strong>${esc(r.device_info)}</strong><br>
          📍 GPS 位置：${fmtGeo(r.geo)}<br>
          🌐 IP 位址：<strong>${esc(r.ip_address || "—")}</strong> · 時區/語系：${esc(r.timezone || "—")} / ${esc(r.locale || "—")}
          ${hw ? `<br>⚙️ 硬體細節：${hw}` : ""}
        </div>
      </div>
      <canvas></canvas><textarea rows="2"></textarea><input placeholder="來源">
      <div class="row"><button class="dl">下載 PNG</button><button class="d del">刪除</button></div>`;
    const cv = el.querySelector("canvas"), ta = el.querySelector("textarea"), au = el.querySelector("input");
    ta.value = r.content; au.value = r.author;
    const redraw = async () => { await ensureFont(ta.value + au.value); drawCard(cv, ta.value, au.value); };
    ta.oninput = au.oninput = redraw; drawCard(cv, r.content, r.author);
    el.querySelector(".dl").onclick = () => cv.toBlob(b => save(b, fname(r)));
    el.querySelector(".del").onclick = async () => {
      if (!confirm("確定刪除？")) return;
      await fetch("/api/admin/proverbs/" + r.id, { method: "DELETE", headers: H }); load();
    };
    grid.appendChild(el);
  }
}

function renderUsers() {
  const ug = $("usersGrid"); ug.innerHTML = "";
  if (!users.length) { ug.innerHTML = '<div class="empty">目前還沒有任何登入過的帳號</div>'; return; }
  for (const u of users) {
    const el = document.createElement("div"); el.className = "u-card";
    const displayName = u.name || (u.email || "").split("@")[0] || "未命名";
    const avHtml = u.picture
      ? `<img class="u-av" src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`
      : `<div class="u-av">${esc(displayName[0]?.toUpperCase() || "U")}</div>`;
    const lastLogin = u.last_sign_in_at ? new Date(u.last_sign_in_at).toLocaleString() : "未知";
    const createdAt = u.created_at ? new Date(u.created_at).toLocaleString() : "未知";
    const selfieAt = u.selfie_at ? new Date(u.selfie_at).toLocaleString() : "";

    el.innerHTML = `
      <div class="u-head">
        ${avHtml}
        <div class="u-title">
          <b>${esc(displayName)}</b>
          <span>${esc(u.email)}</span>
        </div>
      </div>
      <div class="u-photos">
        <div class="u-pbox">
          <small>🔹 Google 帳號頭貼</small>
          ${u.picture ? `<img src="${esc(u.picture)}" title="點擊放大" onclick="window.open(this.src)" referrerpolicy="no-referrer">` : `<div class="no-pic">無頭貼</div>`}
        </div>
        <div class="u-pbox">
          <small>🔸 我們收集的相機實拍照</small>
          ${u.selfie ? `<img src="${esc(u.selfie)}" title="點擊放大（拍攝於 ${esc(selfieAt)}）" onclick="window.open(this.src)">` : `<div class="no-pic">尚未拍攝</div>`}
        </div>
      </div>
      <div class="u-stats">
        <div class="u-stat"><b>${u.login_count}</b><small>累積登入次數</small></div>
        <div class="u-stat"><b>${u.post_count}</b><small>累積貼文留言次數</small></div>
      </div>
      <div class="u-sec">
        <div class="u-sec-title">🔹 Google 帳號資訊（OAuth 提供）</div>
        <div>👤 <strong>全名：</strong>${esc(displayName)}（姓氏：${esc(u.family_name || "—")} / 名字：${esc(u.given_name || "—")}）</div>
        <div>📧 <strong>電子郵件：</strong>${esc(u.email)}（${u.email_verified ? "已驗證" : "未驗證"}）</div>
        <div>🏫 <strong>學校網域 (hd)：</strong>${esc(u.hd || "—")}</div>
        <div>🔑 <strong>Google 唯一 ID (sub)：</strong>${esc(u.google_sub || "—")}</div>
      </div>
      <div class="u-sec">
        <div class="u-sec-title">🔸 我們收集的資訊（相機核實／定位／硬體環境）</div>
        <div>🕒 <strong>最後登入時間：</strong>${esc(lastLogin)}</div>
        <div>📅 <strong>首次註冊時間：</strong>${esc(createdAt)}${selfieAt ? `（實拍核實：${esc(selfieAt)}）` : ""}</div>
        <div>📍 <strong>GPS 定位座標：</strong>${fmtGeo(u.geo)}</div>
        <div>🌐 <strong>最後登入 IP：</strong>${esc(u.last_ip || "—")} · <strong>網路：</strong>${esc(u.network || "—")}</div>
        <div>💻 <strong>裝置／瀏覽器：</strong>${esc(u.last_device)}</div>
        <div>🖥️ <strong>顯示晶片 (GPU)：</strong>${esc(u.gpu || "—")}</div>
        <div>⚙️ <strong>CPU / 記憶體 / 電量：</strong>${esc(u.cores || "—")} / ${esc(u.memory || "—")} / ${esc(u.battery || "—")}</div>
        <div>🌍 <strong>語系 / 時區：</strong>${esc(u.locale || "—")} / ${esc(u.timezone || "—")}</div>
      </div>`;
    ug.appendChild(el);
  }
}

$("toggleUsers").onclick = () => {
  showUsers = !showUsers;
  $("toggleUsers").classList.toggle("active", showUsers);
  $("toggleUsers").innerHTML = showUsers
    ? `← 返回投稿卡片 (${rows.length})`
    : `已登入帳號 (<span id="uCount">${users.length}</span>)`;
  $("pageTitle").innerHTML = (showUsers ? "已登入帳號列表" : "投稿管理") + `<span class="badge" id="count">${showUsers ? users.length : rows.length}</span>`;
  $("grid").classList.toggle("hide", showUsers);
  $("usersGrid").classList.toggle("hide", !showUsers);
  $("szWrap").classList.toggle("hide", showUsers);
  $("dlAll").classList.toggle("hide", showUsers);
};

$("dlAll").onclick = async () => {
  const zip = new JSZip(), items = [...document.querySelectorAll(".item")];
  for (let i = 0; i < items.length; i++) {
    const blob = await new Promise(res => items[i].querySelector("canvas").toBlob(res));
    zip.file(fname(rows[i]), blob);
  }
  save(await zip.generateAsync({ type: "blob" }), "proverbs.zip");
};
$("reload").onclick = load;
$("size").value = FONT_SIZE;
$("size").oninput = () => {
  const v = Math.min(200, Math.max(24, parseInt($("size").value) || 70));
  FONT_SIZE = v; localStorage.setItem("cardFontSize", v);
  document.querySelectorAll(".item").forEach(el => {
    const cv = el.querySelector("canvas"), ta = el.querySelector("textarea"), au = el.querySelector("input");
    drawCard(cv, ta.value, au.value);
  });
};
$("logout").onclick = async () => { await fetch("/api/admin/logout", { method: "POST", headers: H }); location.replace("/"); };
load();
</script>
</body>
</html>
