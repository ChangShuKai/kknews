<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1c1b19;--muted:#8a857c;--line:#e4dfd6}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f3f0ea;color:var(--ink);margin:0}
  header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;margin-right:auto}
  .badge{background:var(--ink);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;margin-left:8px;font-weight:600}
  main{padding:24px;max-width:1500px;margin:0 auto}
  input,textarea{width:100%;padding:10px 12px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;resize:vertical;background:#fff;transition:.2s}
  input:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px #1c1b1912}
  button{padding:9px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  button:hover{opacity:.88;transform:translateY(-1px)}
  button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.d{background:#fff;color:#b42318;border:1px solid #f3c9c5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .item{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 28px #0000000f;transition:.2s}
  .item:hover{box-shadow:0 14px 36px #0000001c}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px;word-break:break-all;line-height:1.5}
  .meta b{color:var(--ink);font-size:14px}
  canvas{width:100%;height:auto;display:block;border-radius:12px;background:repeating-conic-gradient(#eee 0 25%,#f8f8f8 0 50%) 0 0/16px 16px}
  .row{display:flex;gap:8px;margin-top:12px}
  .row button{flex:1}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}
</style>
</head>
<body>
<header>
  <h1>投稿管理<span class="badge" id="count">0</span></h1>
  <button id="reload" class="s">重新整理</button>
  <button id="dlAll">全部下載 ZIP</button>
  <button id="logout" class="s">登出</button>
</header>
<main><div id="grid" class="grid"></div></main>

<script src="/adminusercontrol/jszip.js"></script>
<script>
const $ = id => document.getElementById(id);
let rows = [];
const H = { "Content-Type": "application/json", "X-Requested-With": "fetch" };

/* ---------- 卡片繪製：768x1024 米白圓角卡 + 黑色粗體字 ---------- */
const FONT = '"Reggae One","Noto Serif TC",serif';
function wrap(ctx, text, maxW) {
  const lines = []; let cur = "";
  for (const ch of text) {
    if (ch === "\n" || ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch === "\n" ? "" : ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawCard(canvas, text, author) {
  const W = 768, H = 1024; canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.28)"; ctx.shadowBlur = 18; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 4;
  ctx.fillStyle = "#f4f2ee";
  ctx.beginPath(); ctx.roundRect(28, 4, 692, 996, 44); ctx.fill();
  ctx.restore();
  const PER_LINE = 8;                       // 每行最多 8 個字
  const size = 70;                          // 文字大小
  ctx.font = `${size}px ${FONT}`;
  const lines = [];
  for (const para of String(text).split("\n")) {
    const chars = Array.from(para);
    if (!chars.length) { lines.push(""); continue; }
    for (let i = 0; i < chars.length; i += PER_LINE) lines.push(chars.slice(i, i + PER_LINE).join(""));
  }
  const lh = size * 1.35, total = lines.length * lh, top = 500 - total / 2;
  let widest = 0;
  lines.forEach(l => { widest = Math.max(widest, ctx.measureText(l).width); });
  const x = (W - widest) / 2;               // 文字區塊置中
  ctx.fillStyle = "#000"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  lines.forEach((l, i) => ctx.fillText(l, x, top + lh * i + lh / 2));
  const as = 32;
  ctx.font = `${as}px ${FONT}`; ctx.textAlign = "right";
  ctx.fillText("-" + author, x + widest, top + total + as * 0.9);
}
async function ensureFont(text) { try { await document.fonts.load(`40px ${FONT}`, text); } catch {} }

/* ---------- 資料 ---------- */
async function load() {
  const r = await fetch("/api/admin/proverbs");
  if (r.status === 404) return location.reload();   // session 過期
  rows = await r.json(); render();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fname = r => `${r.id}_${(r.user_email || "").split("@")[0]}.png`;
function save(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function render() {
  $("count").textContent = rows.length;
  const grid = $("grid"); grid.innerHTML = "";
  if (!rows.length) { grid.innerHTML = '<div class="empty">目前還沒有投稿</div>'; return; }
  await ensureFont(rows.map(r => r.content + r.author).join(""));
  for (const r of rows) {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<div class="meta"><b>${esc(r.user_name || r.user_email.split("@")[0])}</b><br>${esc(r.user_email)} · ${new Date(r.created_at).toLocaleString()}</div>
      <canvas></canvas><textarea rows="2"></textarea><input placeholder="來源">
      <div class="row"><button class="dl">下載 PNG</button><button class="d del">刪除</button></div>`;
    const cv = el.querySelector("canvas"), ta = el.querySelector("textarea"), au = el.querySelector("input");
    ta.value = r.content; au.value = r.author;
    const redraw = async () => { await ensureFont(ta.value + au.value); drawCard(cv, ta.value, au.value); };
    ta.oninput = au.oninput = redraw; drawCard(cv, r.content, r.author);
    el.querySelector(".dl").onclick = () => cv.toBlob(b => save(b, fname(r)));
    el.querySelector(".del").onclick = async () => {
      if (!confirm("確定刪除？")) return;
      await fetch("/api/admin/proverbs/" + r.id, { method: "DELETE", headers: H }); load();
    };
    grid.appendChild(el);
  }
}
$("dlAll").onclick = async () => {
  const zip = new JSZip(), items = [...document.querySelectorAll(".item")];
  for (let i = 0; i < items.length; i++) {
    const blob = await new Promise(res => items[i].querySelector("canvas").toBlob(res));
    zip.file(fname(rows[i]), blob);
  }
  save(await zip.generateAsync({ type: "blob" }), "proverbs.zip");
};
$("reload").onclick = load;
$("logout").onclick = async () => { await fetch("/api/admin/logout", { method: "POST", headers: H }); location.replace("/"); };
load();
</script>
</body>
</html>
